name: Import and verify Unleash reference
on:
  push:
    paths: ['.github/workflows/import-reference.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reference-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Copy pinned upstream Git blobs without executing source
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          git clone --depth 1 --no-checkout https://github.com/Unleash/unleash.git "$tmp/source"
          python3 - "$tmp/source" <<'PY'
          import subprocess,sys,json,os
          from pathlib import Path
          repo=sys.argv[1]
          def git(*args):
              return subprocess.check_output(['git','-C',repo,*args])
          rev=git('rev-parse','HEAD').decode().strip()
          tree=git('rev-parse','HEAD^{tree}').decode().strip()
          entries={}
          for item in git('ls-tree','-rz',rev).split(b'\0'):
              if item:
                  meta,path=item.split(b'\t',1)
                  entries[os.fsdecode(path)]=meta.decode().split()
          excluded={}
          expected={}
          for path,(mode,kind,oid) in entries.items():
              if path.startswith('.github/workflows/') or kind!='blob':
                  excluded[path]='upstream workflow disabled' if kind=='blob' else 'external submodule pointer'
                  continue
              data=git('cat-file','blob',oid)
              if data.startswith(b'version https://git-lfs.github.com/spec/v1\n'):
                  excluded[path]='external LFS asset not imported; avoid incomplete push and storage costs'
                  continue
              if path.startswith('.trillionai/') or path=='.github/workflows/import-reference.yml':
                  raise RuntimeError('Reserved import path collision: '+path)
              p=Path(path)
              p.parent.mkdir(parents=True,exist_ok=True)
              data=git('cat-file','blob',oid)
              if p.is_symlink() or p.is_file(): p.unlink()
              if mode=='120000': p.symlink_to(os.fsdecode(data))
              else:
                  p.write_bytes(data)
                  p.chmod(0o755 if mode=='100755' else 0o644)
              subprocess.run(['git','update-index','--add','--cacheinfo',mode,oid,path],check=False,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL) if False else None
              expected[path]=[mode,kind,oid]
          assert any(p.upper().startswith('LICENSE') for p in expected), 'No root license'
          # Insert original objects directly into local index, avoiding line ending conversions and ignored files.
          for path,(mode,kind,oid) in expected.items():
              actual=subprocess.check_output(['git','hash-object','-w','--stdin'],input=git('cat-file','blob',oid)).decode().strip()
              assert actual==oid,path
              subprocess.run(['git','update-index','--add','--cacheinfo',mode,oid,path],check=True)
          staged={}
          for item in subprocess.check_output(['git','ls-files','--stage','-z']).split(b'\0'):
              if item:
                  meta,path=item.split(b'\t',1)
                  mode,oid,stage=meta.decode().split()
                  staged[os.fsdecode(path)]=[mode,'blob',oid]
          missing=sorted(set(expected)-set(staged))
          mismatch=sorted(p for p in expected.keys() & staged.keys() if expected[p]!=staged[p])
          assert not missing and not mismatch,(missing,mismatch)
          Path('.trillionai').mkdir(exist_ok=True)
          report=dict(upstream='https://github.com/Unleash/unleash',upstream_commit=rev,upstream_tree=tree,upstream_tracked_entries=len(entries),upstream_blob_files=sum(m[1]=='blob' for m in entries.values()),expected_source_files=len(expected),verified_source_files=len(expected)-len(missing)-len(mismatch),excluded_paths=excluded,missing_paths=missing,mismatched_paths=mismatch,extra_paths=sorted(set(staged)-set(expected)),scope='Tracked Git blobs; no external LFS payloads, submodule contents or full history.')
          Path('.trillionai/FILE_INVENTORY.json').write_text(json.dumps(report,indent=2)+'\n')
          Path('.trillionai/SOURCE_PROVENANCE.txt').write_text(f'Upstream: https://github.com/Unleash/unleash\nRevision: {rev}\nOriginal tree: {tree}\n')
          print(json.dumps(report,indent=2))
          PY
          git add -f .trillionai/FILE_INVENTORY.json .trillionai/SOURCE_PROVENANCE.txt
          git config user.name "TrillionAI Reference Import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import and hash-verify Unleash upstream source"
          git push origin HEAD:main
